[project]
name = "polyglot-rag"
version = "0.1.0"
description = "Multilingual customer-support retrieval (BM25, multilingual dense, RRF hybrid) with an honest 24-language accuracy table."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "huggingface-hub>=0.23"]

[project.scripts]
polyglot-rag = "polyglot_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyglot_rag"]

[tool.hatch.build.targets.sdist]
include = ["src/polyglot_rag", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["polyglot_rag"]
